name: Test block-list excludes words from labeling
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issues
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with blocked severity value
        id: action-blocked
        uses: .
        continue-on-error: true
        with:
          # Issue form where severity is 'None' which is in the block-list
          issue-form: '{"severity":"None","component":"networking"}'
          section: severity
          block-list: |
            None
            Other
          config-path: .github/advanced-issue-labeler.yml
          token: fake-token

      - name: Assert action ran (blocked value means no labels to set)
        env:
          OUTCOME: ${{ steps.action-blocked.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With a blocked value, the action should either succeed (nothing to do)
          # or fail at the GitHub API call. It should NOT fail at input parsing.
          echo "PASS: action handled block-list correctly (outcome: $OUTCOME)"

      - name: Run action with empty issue-form object
        id: action-empty
        uses: .
        continue-on-error: true
        with:
          issue-form: '{}'
          section: severity
          block-list: ''
          config-path: .github/advanced-issue-labeler.yml
          token: fake-token

      - name: Assert action handled empty issue-form
        env:
          OUTCOME: ${{ steps.action-empty.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # Empty issue-form is valid JSON (empty record), action should process it
          echo "PASS: action handled empty issue-form (outcome: $OUTCOME)"
