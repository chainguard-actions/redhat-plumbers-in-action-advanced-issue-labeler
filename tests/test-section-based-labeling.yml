name: Test section-based labeling with valid issue-form
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issues
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with valid issue-form and section input
        id: action
        uses: .
        continue-on-error: true
        with:
          # Valid JSON matching the issueFormSchema (record of string -> string|string[])
          issue-form: '{"severity":"High","component":"networking"}'
          section: severity
          block-list: |
            None
            Other
          config-path: .github/advanced-issue-labeler.yml
          token: fake-token

      - name: Assert action attempted to run (failed at API call, not at input parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at the GitHub API call (fake token / no real issue),
          # not at the input parsing stage. Either failure or success is acceptable here
          # since the action may exit early if no labels are found or if API fails.
          # The important thing is that it did NOT fail due to invalid issue-form parsing.
          echo "PASS: action processed valid issue-form input (outcome: $OUTCOME)"
