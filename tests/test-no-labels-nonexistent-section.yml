name: Test - No labels when section not found in issue form
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          # issue-form only has a field not present in the fixture config sections (severity, type)
          # so config-based labeling finds no matching sections -> labels=[]
          # For input-based fallback: section=nonexistent is not in the issue form -> labels=[]
          issue-form: '{"nonexistent_field":"High"}'
          section: nonexistent
          config-path: tests/fixtures/advanced-issue-labeler.yml
          token: ${{ github.token }}

      - name: Assert labels output is empty array
        env:
          ACTUAL: ${{ steps.action.outputs.labels }}
        run: |
          echo "actual labels: $ACTUAL"
          if [ "$ACTUAL" != "[]" ]; then
            echo "FAIL: expected '[]' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: labels is empty array as expected (section not found)"

      - name: Assert policy output has empty section
        env:
          ACTUAL: ${{ steps.action.outputs.policy }}
        run: |
          echo "actual policy: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: policy output is empty"
            exit 1
          fi
          echo "PASS: policy output is set"
