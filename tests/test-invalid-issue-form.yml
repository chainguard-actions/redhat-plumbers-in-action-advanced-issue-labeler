name: Test invalid issue-form input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid issue-form JSON
        id: action
        uses: .
        continue-on-error: true
        with:
          issue-form: 'not-valid-json'
          section: severity
          config-path: .github/advanced-issue-labeler.yml
          token: ${{ github.token }}

      - name: Assert action failed due to invalid JSON
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed on invalid issue-form JSON"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed on invalid JSON input"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
