name: Test invalid issue-form input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with invalid issue-form JSON
        id: action
        uses: .
        continue-on-error: true
        with:
          issue-form: 'not-valid-json'
          section: severity
          config-path: .github/advanced-issue-labeler.yml
          token: ${{ github.token }}

      - name: Assert action failed due to invalid issue-form
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid issue-form JSON, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when given invalid issue-form JSON"
