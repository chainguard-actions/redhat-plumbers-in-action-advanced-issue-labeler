name: Test - Invalid issue-form input causes action failure
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        # Expect this step to fail due to invalid issue-form JSON
        continue-on-error: true
        with:
          issue-form: 'not-valid-json'
          section: severity
          config-path: tests/fixtures/advanced-issue-labeler.yml
          token: ${{ github.token }}

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid issue-form, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid issue-form input"
