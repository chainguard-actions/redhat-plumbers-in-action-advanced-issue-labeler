name: Test config-based labeling with policy file
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issues
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with config-based policy
        id: action
        uses: .
        continue-on-error: true
        with:
          # Valid JSON matching the issueFormSchema
          issue-form: '{"severity":"High","component":"networking"}'
          config-path: pristine/redhat-plumbers-in-action--advanced-issue-labeler/v3.2.3/tests/fixtures/advanced-issue-labeler.yml
          token: fake-token

      - name: Assert action attempted to run
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action will fail at the GitHub API call (fake token / no real issue context),
          # but it should NOT fail due to invalid issue-form or config parsing.
          echo "PASS: action processed config-based labeling inputs (outcome: $OUTCOME)"
